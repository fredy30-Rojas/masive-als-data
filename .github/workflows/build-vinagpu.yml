name: Build Vina-GPU-2.1

on:
  push:
    paths:
      - '.github/workflows/build-vinagpu.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc g++ make wget \
            ocl-icd-opencl-dev opencl-headers
          echo "Dependencias OK"

      - name: Descargar Boost 1.84 completo (version exacta del codigo)
        run: |
          cd /tmp
          wget -q https://archives.boost.io/release/1.84.0/source/boost_1_84_0.tar.gz
          tar -xzf boost_1_84_0.tar.gz
          ls -d /tmp/boost_1_84_0
          echo "Boost OK"

      - name: Descargar Vina-GPU-2.1
        run: |
          cd /tmp
          git clone --depth 1 https://github.com/DeltaGroupNJUPT/Vina-GPU-2.1.git
          echo "Vina-GPU OK"

      - name: Compilar AutoDock-Vina-GPU-2.1
        id: build
        continue-on-error: true
        run: |
          cd /tmp/Vina-GPU-2.1/AutoDock-Vina-GPU-2.1
          cat > Makefile <<'EOF'
          WORK_DIR=/tmp/Vina-GPU-2.1/AutoDock-Vina-GPU-2.1
          BOOST_LIB_PATH=/tmp/boost_1_84_0
          OPENCL_LIB_PATH=/usr
          OPENCL_VERSION=-DOPENCL_2_0
          GPU_PLATFORM=-DNVIDIA_PLATFORM
          DOCKING_BOX_SIZE=-DSMALL_BOX
          BOOST_INC_PATH=-I$(BOOST_LIB_PATH) -I$(BOOST_LIB_PATH)/boost
          VINA_GPU_INC_PATH=-I$(WORK_DIR)/lib -I$(WORK_DIR)/OpenCL/inc
          OPENCL_INC_PATH=-I/usr/include
          LIB1=-lboost_program_options -lboost_system -lboost_filesystem -lOpenCL
          LIB2=-lstdc++
          LIB3=-lm -lpthread
          LIB_PATH=-L$(BOOST_LIB_PATH)/stage/lib -L/usr/lib/x86_64-linux-gnu
          SRC=./lib/*.cpp ./OpenCL/src/wrapcl.cpp $(BOOST_LIB_PATH)/libs/thread/src/pthread/thread.cpp $(BOOST_LIB_PATH)/libs/thread/src/pthread/once.cpp
          MACRO=$(OPENCL_VERSION) $(GPU_PLATFORM) $(DOCKING_BOX_SIZE) -DBOOST_TIMER_ENABLE_DEPRECATED
          all:out
          out:./main/main.cpp
          	gcc -o AutoDock-Vina-GPU-2-1 $(BOOST_INC_PATH) $(VINA_GPU_INC_PATH) $(OPENCL_INC_PATH) ./main/main.cpp -O3 $(SRC) $(LIB1) $(LIB2) $(LIB3) $(LIB_PATH) $(MACRO) -DNDEBUG
          source:./main/main.cpp
          	gcc -o AutoDock-Vina-GPU-2-1 $(BOOST_INC_PATH) $(VINA_GPU_INC_PATH) $(OPENCL_INC_PATH) ./main/main.cpp -O3 $(SRC) $(LIB1) $(LIB2) $(LIB3) $(LIB_PATH) $(MACRO) -DNDEBUG -DBUILD_KERNEL_FROM_SOURCE
          clean:
          	rm -f AutoDock-Vina-GPU-2-1
          EOF
          make clean
          make source > /tmp/build.log 2>&1
          RC=$?
          tail -40 /tmp/build.log
          echo "EXIT=$RC"
          exit $RC

      - name: Mostrar y guardar log
        if: always()
        run: |
          cp /tmp/build.log /tmp/out_build.log 2>/dev/null || echo "no build.log"
          mkdir -p /tmp/out
          cp /tmp/build.log /tmp/out/build_log.txt 2>/dev/null || echo "sin log"
          echo "Log listo"

      - name: Subir build.log al repo (diagnostico)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/out
          python3 - <<'PY'
          import base64, json, os, urllib.request
          TOKEN = os.environ['GH_TOKEN']
          data = open('build_log.txt','rb').read()
          path = 'vinagpu_build_log.txt'
          sha = None
          try:
              req = urllib.request.Request('https://api.github.com/repos/fredy30-Rojas/masive-als-data/contents/' + path,
                  headers={'Authorization': 'token ' + TOKEN})
              sha = json.loads(urllib.request.urlopen(req, timeout=60).read().decode())['sha']
          except Exception:
              pass
          payload = {'message': 'Log compilacion Vina-GPU', 'content': base64.b64encode(data).decode()}
          if sha:
              payload['sha'] = sha
          req2 = urllib.request.Request('https://api.github.com/repos/fredy30-Rojas/masive-als-data/contents/' + path,
              data=json.dumps(payload).encode(), method='PUT',
              headers={'Authorization': 'token ' + TOKEN, 'Content-Type': 'application/json'})
          try:
              urllib.request.urlopen(req2, timeout=180)
              print('LOG SUBIDO AL REPO')
          except urllib.error.HTTPError as e:
              print('ERROR log:', e.code, e.read().decode()[:200])
          PY

      - name: Empaquetar binario
        run: |
          echo "=== Contenido AutoDock dir ==="
          ls -la /tmp/Vina-GPU-2.1/AutoDock-Vina-GPU-2.1/ | head -20
          echo "=== Buscar binario ==="
          find /tmp/Vina-GPU-2.1 -type f -name 'AutoDock*' -o -type f -name '*-2-1' | head -5
          mkdir -p /tmp/out/vinagpu_linux
          BIN=$(find /tmp/Vina-GPU-2.1/AutoDock-Vina-GPU-2.1 -maxdepth 1 -type f -name 'AutoDock-Vina-GPU-2-1' | head -1)
          if [ -n "$BIN" ]; then
            cp "$BIN" /tmp/out/vinagpu_linux/AutoDock-Vina-GPU-2-1
            echo "Binario copiado: $BIN"
          else
            echo "ERROR: no se encontro el binario compilado"
            ls -la /tmp/Vina-GPU-2.1/AutoDock-Vina-GPU-2.1/
            exit 1
          fi
          cp /usr/lib/x86_64-linux-gnu/libOpenCL.so.1* /tmp/out/vinagpu_linux/ 2>/dev/null || true
          cd /tmp/out
          tar -czf vinagpu_linux.tar.gz vinagpu_linux
          ls -la vinagpu_linux.tar.gz
          echo "=== file binario ==="
          file /tmp/out/vinagpu_linux/AutoDock-Vina-GPU-2-1 || true

      - name: Subir binario al repo (release binario)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/out
          # push del tar.gz al repo mediante la API con GITHUB_TOKEN
          python3 - <<'PY'
          import base64, json, os, urllib.request
          TOKEN = os.environ['GH_TOKEN']
          path = 'vinagpu_linux.tar.gz'
          data = open('vinagpu_linux.tar.gz','rb').read()
          sha = None
          try:
              req = urllib.request.Request('https://api.github.com/repos/fredy30-Rojas/masive-als-data/contents/' + path,
                  headers={'Authorization': 'token ' + TOKEN})
              sha = json.loads(urllib.request.urlopen(req, timeout=60).read().decode())['sha']
          except Exception:
              pass
          payload = {'message': 'Vina-GPU-2.1 binario compilado', 'content': base64.b64encode(data).decode()}
          if sha:
              payload['sha'] = sha
          req2 = urllib.request.Request('https://api.github.com/repos/fredy30-Rojas/masive-als-data/contents/' + path,
              data=json.dumps(payload).encode(), method='PUT',
              headers={'Authorization': 'token ' + TOKEN, 'Content-Type': 'application/json'})
          try:
              urllib.request.urlopen(req2, timeout=180)
              print('BINARIO SUBIDO AL REPO OK')
          except urllib.error.HTTPError as e:
              print('ERROR subiendo:', e.code, e.read().decode()[:200])
          PY

      - name: Subir log (por si fallo la compilacion)
        if: failure()
        run: |
          echo "Ver build.log en los logs del run"
          tail -50 /tmp/build.log
