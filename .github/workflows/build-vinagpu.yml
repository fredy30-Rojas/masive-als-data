name: Build Vina-GPU-2.1

on:
  push:
    paths:
      - '.github/workflows/build-vinagpu.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc g++ make wget \
            libboost-program-options-dev libboost-filesystem-dev \
            libboost-system-dev libboost-thread-dev \
            ocl-icd-opencl-dev opencl-headers
          echo "Dependencias OK"

      - name: Descargar 2 fuentes de Boost (thread.cpp y once.cpp)
        run: |
          mkdir -p /tmp/boost_src/pthread
          wget -q -O /tmp/boost_src/pthread/thread.cpp \
            https://raw.githubusercontent.com/boostorg/thread/boost-1.84.0/src/pthread/thread.cpp
          wget -q -O /tmp/boost_src/pthread/once.cpp \
            https://raw.githubusercontent.com/boostorg/thread/boost-1.84.0/src/pthread/once.cpp
          ls -la /tmp/boost_src/pthread/
          echo "Boost src OK"

      - name: Descargar Vina-GPU-2.1
        run: |
          cd /tmp
          git clone --depth 1 https://github.com/DeltaGroupNJUPT/Vina-GPU-2.1.git
          echo "Vina-GPU OK"

      - name: Compilar AutoDock-Vina-GPU-2.1
        run: |
          cd /tmp/Vina-GPU-2.1/AutoDock-Vina-GPU-2.1
          # Escribir Makefile adaptado (boost de apt + OpenCL de apt)
          cat > Makefile <<'EOF'
          WORK_DIR=/tmp/Vina-GPU-2.1/AutoDock-Vina-GPU-2.1
          BOOST_LIB_PATH=/usr
          OPENCL_LIB_PATH=/usr
          OPENCL_VERSION=-DOPENCL_2_0
          GPU_PLATFORM=-DNVIDIA_PLATFORM
          DOCKING_BOX_SIZE=-DSMALL_BOX
          BOOST_INC_PATH=-I/usr/include
          VINA_GPU_INC_PATH=-I$(WORK_DIR)/lib -I$(WORK_DIR)/OpenCL/inc
          OPENCL_INC_PATH=-I/usr/include
          LIB1=-lboost_program_options -lboost_system -lboost_filesystem -lboost_thread -lOpenCL
          LIB2=-lstdc++ -lstdc++fs
          LIB3=-lm -lpthread
          LIB_PATH=-L/usr/lib/x86_64-linux-gnu
          SRC=./lib/*.cpp ./OpenCL/src/wrapcl.cpp /tmp/boost_src/pthread/thread.cpp /tmp/boost_src/pthread/once.cpp
          MACRO=$(OPENCL_VERSION) $(GPU_PLATFORM) $(DOCKING_BOX_SIZE) -DBOOST_TIMER_ENABLE_DEPRECATED
          all:out
          out:./main/main.cpp
          	gcc -o AutoDock-Vina-GPU-2-1 $(BOOST_INC_PATH) $(VINA_GPU_INC_PATH) $(OPENCL_INC_PATH) ./main/main.cpp -O3 $(SRC) $(LIB1) $(LIB2) $(LIB3) $(LIB_PATH) $(MACRO) -DNDEBUG
          source:./main/main.cpp
          	gcc -o AutoDock-Vina-GPU-2-1 $(BOOST_INC_PATH) $(VINA_GPU_INC_PATH) $(OPENCL_INC_PATH) ./main/main.cpp -O3 $(SRC) $(LIB1) $(LIB2) $(LIB3) $(LIB_PATH) $(MACRO) -DNDEBUG -DBUILD_KERNEL_FROM_SOURCE
          clean:
          	rm -f AutoDock-Vina-GPU-2-1
          EOF
          make clean
          make source 2>&1 | tail -30
          ls -la AutoDock-Vina-GPU-2-1
          file AutoDock-Vina-GPU-2-1

      - name: Probar binario
        run: |
          cd /tmp/Vina-GPU-2.1/AutoDock-Vina-GPU-2.1
          ldd AutoDock-Vina-GPU-2-1 2>&1 | head -10 || true
          ./AutoDock-Vina-GPU-2-1 --help 2>&1 | head -5 || echo "Sin GPU en CI: no puede inicializar OpenCL (esperado). El binario es valido."

      - name: Empaquetar binario
        run: |
          cd /tmp/Vina-GPU-2.1/AutoDock-Vina-GPU-2.1
          mkdir -p /tmp/out/vinagpu_linux
          cp AutoDock-Vina-GPU-2-1 /tmp/out/vinagpu_linux/
          cp /usr/lib/x86_64-linux-gnu/libOpenCL.so.1* /tmp/out/vinagpu_linux/ 2>/dev/null || true
          cd /tmp/out
          tar -czf vinagpu_linux.tar.gz vinagpu_linux
          ls -la vinagpu_linux.tar.gz

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: vinagpu-linux
          path: /tmp/out/vinagpu_linux.tar.gz
          retention-days: 30
