name: Build Vina-GPU-2.1

on:
  push:
    paths:
      - '.github/workflows/build-vinagpu.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc g++ make wget unzip \
            libboost-program-options-dev libboost-filesystem-dev \
            libboost-system-dev ocl-icd-opencl-dev opencl-headers
          echo "Dependencias OK"

      - name: Descargar Boost 1.84 (fuente para thread.cpp/once.cpp)
        run: |
          cd /tmp
          wget -q https://github.com/boostorg/boost/releases/download/boost-1.84.0/boost-1.84.0.tar.gz
          tar -xzf boost-1.84.0.tar.gz
          ls -d /tmp/boost_1_84_0
          echo "Boost OK"

      - name: Descargar Vina-GPU-2.1
        run: |
          cd /tmp
          git clone --depth 1 https://github.com/DeltaGroupNJUPT/Vina-GPU-2.1.git
          echo "Vina-GPU OK"

      - name: Compilar AutoDock-Vina-GPU-2.1
        run: |
          cd /tmp/Vina-GPU-2.1/AutoDock-Vina-GPU-2.1
          # Ajustar paths para el sistema (boost de apt + OpenCL de apt)
          sed -i 's|^BOOST_LIB_PATH=.*|BOOST_LIB_PATH=/tmp/boost_1_84_0|' Makefile
          sed -i 's|^OPENCL_LIB_PATH=.*|OPENCL_LIB_PATH=/usr|' Makefile
          sed -i 's|^LIB_PATH=.*|LIB_PATH=-L$(BOOST_LIB_PATH)/stage/lib -L/usr/lib/x86_64-linux-gnu|' Makefile
          # boost de apt provee -lboost_program_options/-lboost_system/-lboost_filesystem en /usr/lib
          make clean
          make source 2>&1 | tail -20
          ls -la AutoDock-Vina-GPU-2-1
          file AutoDock-Vina-GPU-2-1

      - name: Probar --help
        run: |
          cd /tmp/Vina-GPU-2.1/AutoDock-Vina-GPU-2.1
          # El binario necesita libOpenCL; sin GPU solo probamos que el binario existe y es ELF
          ./AutoDock-Vina-GPU-2-1 --help 2>&1 | head -5 || echo "Sin GPU en CI: el binario no puede inicializar OpenCL (esperado). El binario es valido."

      - name: Empaquetar binario
        run: |
          cd /tmp/Vina-GPU-2.1/AutoDock-Vina-GPU-2.1
          mkdir -p /tmp/out/vinagpu_linux
          cp AutoDock-Vina-GPU-2-1 /tmp/out/vinagpu_linux/
          # Copiar tambien las librerias OpenCL de apt (libOpenCL.so.1) por si hacen falta en CI
          cp /usr/lib/x86_64-linux-gnu/libOpenCL.so.1* /tmp/out/vinagpu_linux/ 2>/dev/null || true
          cd /tmp/out
          tar -czf vinagpu_linux.tar.gz vinagpu_linux
          ls -la vinagpu_linux.tar.gz

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: vinagpu-linux
          path: /tmp/out/vinagpu_linux.tar.gz
          retention-days: 30
